name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify version tag
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - name: Install locked dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Publish npm package
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            echo "${package}@${version} is already published"
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Quick Review ${GITHUB_REF_NAME}"
          fi
